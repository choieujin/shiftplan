# Play 스토어 업로드용 서명된 AAB 빌드.
# 서명 키는 GitHub Secrets(ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PROPERTIES)에서 주입.
name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - claude/shift-schedule-calendar-widget-6xfam4
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - ".github/workflows/android-aab.yml"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret이 없습니다. 서명 키를 등록하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties

      - name: Build AAB
        run: flutter build appbundle --release

      # Play 업로드용 AAB와 별개로, 기기에 직접 설치할 수 있는 APK도 만든다.
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: shiftplan-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: shiftplan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
