# 서명 없는 iOS .ipa 빌드 — AltStore/사이드로딩용.
# GitHub의 macOS 러너(Xcode 포함)에서 빌드하므로 로컬에 Xcode가 필요 없다.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - claude/shift-schedule-calendar-widget-6xfam4
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr shiftplan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: shiftplan-ipa
          path: shiftplan.ipa
          retention-days: 30
