# 서명 없는 iOS .ipa 빌드 — AltStore/사이드로딩용.
# GitHub의 macOS 러너(Xcode 포함)에서 빌드하므로 로컬에 Xcode가 필요 없다.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - claude/shift-schedule-calendar-widget-6xfam4
    paths:
      - "lib/**"
      - "ios/**"
      - "scripts/**"
      - "pubspec.yaml"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Add widget extension target
        run: |
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby scripts/add_widget_target.rb

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # 서명 없는 바이너리에는 entitlements가 없어 AltStore가 App Group을
      # 인식하지 못한다. 애드혹 서명으로 entitlements를 심어준다.
      - name: Ad-hoc sign with entitlements
        run: |
          APP=build/ios/iphoneos/Runner.app
          ls "$APP/PlugIns/ShiftWidget.appex" || { echo "widget missing!"; exit 1; }
          for f in "$APP/Frameworks/"*.framework; do codesign --force -s - "$f"; done
          codesign --force -s - --entitlements ios/ShiftWidget/ShiftWidget.entitlements "$APP/PlugIns/ShiftWidget.appex"
          codesign --force -s - --entitlements ios/Runner/Runner.entitlements "$APP"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr shiftplan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: shiftplan-ipa
          path: shiftplan.ipa
          retention-days: 30
